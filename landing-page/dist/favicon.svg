<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <title>Pandian AI — AI Automation Architect</title>
  <!-- Background -->
  <rect width="32" height="32" rx="6" fill="#07070F"/>
  <!-- Left spine connecting all layers -->
  <line x1="9" y1="9.5" x2="9" y2="23.5" stroke="#1D2A2A" stroke-width="1.2" stroke-linecap="round"/>
  <!-- Layer L5/Ext — top bar, narrowest, purple -->
  <rect x="9" y="8" width="7" height="3" rx="0.8" fill="#7F77DD"/>
  <!-- Layer L3/Mem — mid bar, blue-teal -->
  <rect x="9" y="14" width="11" height="3" rx="0.8" fill="#4A9ECB"/>
  <!-- Layer L1/Perc — bottom bar, widest, teal -->
  <rect x="9" y="20" width="15" height="3" rx="0.8" fill="#1D9E75"/>
  <!-- Apex node — circuit endpoint at top-right of L5 bar -->
  <circle cx="17.5" cy="9.5" r="2.2" fill="#7F77DD"/>
  <circle cx="17.5" cy="9.5" r="1" fill="#CECBF6"/>
</svg>
